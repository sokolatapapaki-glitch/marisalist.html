<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Οι δουλειές μου</title>

  <!-- Εικονίδιο εφαρμογής -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">

  <!-- Icon για κινητά (Add to Home Screen) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ffffff'/%3E%3Ctext x='50%' y='65%' text-anchor='middle' font-size='70'%3E❤️%3C/text%3E%3C/svg%3E">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 15px;
    }
    .box {
      background: white;
      padding: 15px;
      max-width: 520px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    .date-group {
      margin-top: 20px;
    }

    .date-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 15px;
    }

    .delete {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      li { flex-direction: column; align-items: flex-start; }
      .delete { margin-top: 6px; }
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🗓️ Οι δουλειές μου</h2>

  <input type="date" id="date">
  <input type="text" id="task" placeholder="Γράψε τι έχεις να κάνεις…" onkeydown="handleEnter(event)">

  <button onclick="addTask()">➕ Προσθήκη</button>

  <div id="tasks"></div>
</div>

<script>
  let data = JSON.parse(localStorage.getItem('tasks')) || {};

  function save() {
    localStorage.setItem('tasks', JSON.stringify(data));
  }

  function formatDate(isoDate) {
    const [y, m, d] = isoDate.split('-');
    return `${d}-${m}-${y}`;
  }

  function addTask() {
    const dateInput = document.getElementById('date').value;
    const task = document.getElementById('task').value.trim();

    if (!dateInput || !task) {
      alert('Βάλε ημερομηνία και δουλειά 🙂');
      return;
    }

    if (!data[dateInput]) data[dateInput] = [];
    data[dateInput].push(task);

    save();
    render();
    document.getElementById('task').value = '';
  }

  function handleEnter(e) {
    if (e.key === 'Enter') {
      addTask();
    }
  }

  function deleteTask(date, index) {
    data[date].splice(index, 1);
    if (data[date].length === 0) delete data[date];
    save();
    render();
  }

  function render() {
    const container = document.getElementById('tasks');
    container.innerHTML = '';

    const todayISO = new Date().toISOString().split('T')[0];

    Object.keys(data).sort().forEach(date => {
      const group = document.createElement('div');
      group.className = 'date-group';

      const title = document.createElement('div');
      title.className = 'date-title';
      title.textContent = formatDate(date);
      group.appendChild(title);

      const ul = document.createElement('ul');

      data[date].forEach((task, i) => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = task;

        const del = document.createElement('button');
        del.textContent = '🗑️';
        del.className = 'delete';
        del.onclick = () => deleteTask(date, i);

        li.appendChild(span);
        li.appendChild(del);
        ul.appendChild(li);
      });

      group.appendChild(ul);
      container.appendChild(group);

      if (date === todayISO) {
        setTimeout(() => {
          alert('🔔 Υπενθύμιση! Έχεις δουλειές για σήμερα');
        }, 400);
      }
    });
  }

  render();
</script>

</body>
</html>
